<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRM - Manager Login</title>

    <link rel="stylesheet" href="login-style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <h1>PRM</h1>

        <h2>Manager Login</h2>

        <p>Pathematic Residence Management</p>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter Username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>
            <p id="message"></p>
        </form>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>
    <script src="manager-login.js"></script>
</body>

</html>
