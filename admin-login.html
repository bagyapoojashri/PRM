<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRM - Admin Login</title>

    <link rel="stylesheet" href="admin-login-style.css">

</head>

<body class="admin-login-page">

    <div class="admin-login-container">

        <h1>PRM</h1>

        <h2>Admin Login</h2>

        <p>Pathematic Residence Management</p>

        <form id="adminLoginForm">

            <label for="adminUsername">
                Admin Username
            </label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Enter Admin Username"
                required
            >

            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                ADMIN LOGIN
            </button>

            <p id="loginMessage"></p>

        </form>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

    <script src="admin-login.js"></script>

</body>

</html>
